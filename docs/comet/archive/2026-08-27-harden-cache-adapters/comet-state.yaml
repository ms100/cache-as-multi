acceptance:
  - id: A1
    source: brief.md
    text: "A1：向允许 null 的 ConcurrentMap 增强缓存批量写入 `{key: null}` 不抛
      `NullPointerException`，随后批量读取能识别该缓存值。"
    result: passed
    reason:
      text: ConcurrentMap 定向测试以允许 null 的 ConcurrentMapCache 执行
        multiPut({missing:null})，native store 中得到非 null holder，multiGet 返回存在且解包为
        null 的 ValueWrapper；Runtime 测试通过。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：store-by-value 的批量写入与单条 `put` 一样存储序列化副本，而非原对象引用。
    result: passed
    reason:
      text: store-by-value 测试通过 ConcurrentMapCacheManager 的原序列化配置写入可变
        List，随后修改原对象；native value 与原对象非同一引用，缓存读取仍为写入时副本。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：实际 native store 接收 `toStoreValue` 转换后的映射，不再接收原始输入 map。
    result: passed
    reason:
      text: 实际实现先逐值调用 toStoreValue 写入 newMap，最终明确执行 store.putAll(newMap)，未再把原始 map 传给
        native store。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：生产代码不使用 Java `assert` 校验必需反射成员或待序列化缓存值。
    result: passed
    reason:
      text: Redis 待序列化值校验改为 Spring Assert.state，两个反射成员校验改为显式异常；只读扫描
        cache-as-multi/src/main/java 未发现 Java assert。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：必需的 Spring 内部字段/方法不存在时，初始化异常包含目标类型和成员名。
    result: passed
    reason:
      text: ConcurrentMap serialization 字段、Redis writer execute 方法和 Redis customizer
        defaultCacheConfiguration 字段均通过 required-member helper
        解析；缺失异常消息包含目标类型全名和成员名，三条定向测试均通过。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：Redis writer 反射调用的底层运行时异常直接传播或成为直接 cause，不退化为无信息的
      `InvocationTargetException`/`UndeclaredThrowableException`。
    result: passed
    reason:
      text: Redis execute 显式捕获 InvocationTargetException：RuntimeException 和 Error
        原样抛出，checked cause 作为 IllegalStateException 的直接 cause；Mockito 测试确认底层
        connectionFailure 以同一实例直接传播。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：相关回归测试无需真实 Redis，且现有缓存适配器公共接口保持不变。
    result: passed
    reason:
      text: 新增 Redis 测试使用 Mockito RedisConnectionFactory，并在 getConnection
        处抛出模拟异常，不连接网络；dev...HEAD 仅修改三个实现类并新增三个测试，EnhancedCache 及
        EnhancedCacheConverter 公共接口无差异。
      truncated: false
  - id: A8
    source: specs/cache-adapter-reliability/spec.md
    text: 每个输入值必须经过 `toStoreValue` 后再写入 native store。
    result: passed
    reason:
      text: multiPut 对每个输入值执行 toStoreValue，并把转换后的 newMap 整体写入 native store。
      truncated: false
  - id: A9
    source: specs/cache-adapter-reliability/spec.md
    text: 允许 null 时使用 Spring 内部 null holder，不能把原始 null 传给 `ConcurrentHashMap`。
    result: passed
    reason:
      text: 允许 null 时 null 由继承自 ConcurrentMapCache 的 toStoreValue 转换为 Spring null
        holder，行为测试证明未把原始 null 传入 ConcurrentHashMap。
      truncated: false
  - id: A10
    source: specs/cache-adapter-reliability/spec.md
    text: store-by-value 时使用源缓存的序列化配置，批量写入与单条写入保持一致。
    result: passed
    reason:
      text: converter 从源 ConcurrentMapCache 的 serialization 字段取得
        SerializationDelegate，并传给共享同一 native store 的增强缓存；store-by-value
        行为测试证明批量写入保存序列化副本。
      truncated: false
  - id: A11
    source: specs/cache-adapter-reliability/spec.md
    text: 必需的内部字段和方法在初始化时显式验证，缺失异常包含类型与成员名。
    result: passed
    reason:
      text: 目标范围内的三个必需内部成员均在静态初始化或 Redis 增强缓存构造时显式解析，缺失时的 IllegalStateException
        原因包含类型与成员名。
      truncated: false
  - id: A12
    source: specs/cache-adapter-reliability/spec.md
    text: 生产代码不使用默认关闭的 Java `assert` 保证必需状态。
    result: passed
    reason:
      text: 目标模块生产源码只读 rg 扫描无 Java assert；原有两处相关 assert 均已替换为运行时显式校验。
      truncated: false
  - id: A13
    source: specs/cache-adapter-reliability/spec.md
    text: 反射目标抛出的运行时异常保持为调用方可识别的根因，不能只暴露反射包装异常。
    result: passed
    reason:
      text: InvocationTargetException 不再向调用方泄漏；底层 RuntimeException/Error 保持原根因，其他
        Throwable 也成为语义明确异常的直接 cause。
      truncated: false
  - id: A14
    source: specs/cache-adapter-reliability/spec.md
    text: 不改变 `EnhancedCache` 公共接口和正常批量语义。
    result: passed
    reason:
      text: EnhancedCache 公共接口未修改，multiGet/multiEvict 和正常 multiPut
        入口语义保持不变；候选只修正值转换、诊断和异常展开。
      truncated: false
  - id: A15
    source: specs/cache-adapter-reliability/spec.md
    text: 单元测试覆盖 null、store-by-value、成员缺失诊断和底层异常展开，且不连接 Redis。
    result: passed
    reason:
      text: 新增 6 条定向单元测试覆盖 allow-null、store-by-value、ConcurrentMap/Redis/customizer
        成员缺失诊断及底层异常展开；连同既有 conversion 测试共 7 tests、0 failures、0 errors，Redis
        路径完全使用 mock。
      truncated: false
